name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m venv /tmp/coursemesh-publish
          /tmp/coursemesh-publish/bin/python -m pip install --no-deps dist/*.whl
          installed_version="$(/tmp/coursemesh-publish/bin/coursemesh --version | awk '{print $2}')"
          test "${RELEASE_TAG}" = "v${installed_version}" || {
            echo "Requested tag ${RELEASE_TAG} does not match package version ${installed_version}." >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
