name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/coursemesh-release
          /tmp/coursemesh-release/bin/python -m pip install --no-deps dist/*.whl
          /tmp/coursemesh-release/bin/coursemesh --version
      - name: Create GitHub release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
