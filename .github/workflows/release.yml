name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test wheel and verify tag version
        shell: bash
        run: |
          python -m venv /tmp/coursemesh-release
          /tmp/coursemesh-release/bin/python -m pip install --no-deps dist/*.whl
          installed_version="$(/tmp/coursemesh-release/bin/coursemesh --version | awk '{print $2}')"
          test "${GITHUB_REF_NAME}" = "v${installed_version}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${installed_version}." >&2
            exit 1
          }
      - name: Create GitHub release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
