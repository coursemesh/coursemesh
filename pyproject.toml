[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursemesh"
version = "0.1.0"
description = "Local-first course calendar aggregation and change detection for students"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CourseMesh contributors" }]
keywords = ["moodle", "studip", "icalendar", "student", "calendar", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]

[project.scripts]
coursemesh = "coursemesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/coursemesh/coursemesh"
Repository = "https://github.com/coursemesh/coursemesh"
Issues = "https://github.com/coursemesh/coursemesh/issues"
Documentation = "https://github.com/coursemesh/coursemesh#readme"
